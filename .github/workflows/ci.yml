name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install -e .

    - name: Run pytest test suite
      env:
        PYTHONPATH: src
        PYTHONUTF8: "1"
        PYTHONIOENCODING: "utf-8"
      run: |
        pytest -v --tb=short

    - name: Verify CLI stats
      env:
        PYTHONPATH: src
        PYTHONUTF8: "1"
        PYTHONIOENCODING: "utf-8"
      run: |
        python -m certpath_roadmap_studio.cli stats

    - name: Verify CLI doctor
      env:
        PYTHONPATH: src
        PYTHONUTF8: "1"
        PYTHONIOENCODING: "utf-8"
      run: |
        python -m certpath_roadmap_studio.cli doctor
