[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "certpath-roadmap-studio"
version = "0.1.0"
description = "Interactive Certification Roadmap Studio & Career Path DAG Solver"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "1nc0gn30" }
]
keywords = [
    "certification",
    "roadmap",
    "dag",
    "career-planner",
    "prerequisites",
    "mcp",
    "model-context-protocol",
    "fastmcp",
    "mermaid",
    "material-3",
    "zero-dependencies"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
certpath-roadmap-studio = "certpath_roadmap_studio.cli:main"
certpath = "certpath_roadmap_studio.cli:main"

[project.urls]
Homepage = "https://github.com/1nc0gn30/certpath-roadmap-studio"
Repository = "https://github.com/1nc0gn30/certpath-roadmap-studio"
Issues = "https://github.com/1nc0gn30/certpath-roadmap-studio/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
